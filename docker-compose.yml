name: bms

networks:
  bms-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.28.0.0/16"
        - subnet: "2001:db8::/32"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bms-server
    restart: unless-stopped
    ports:
      - "${PORT_SERVER:-4000}:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Fpg9tybL6TtTP58o@db.nhghoutdgohsetexrwat.supabase.co:5432/postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    networks:
      - bms-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000}
    container_name: bms-client
    restart: unless-stopped
    ports:
      - "${PORT_CLIENT:-3000}:3000"
    depends_on:
      - server
    networks:
      - bms-net
